name: ibn_sina
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  bloc: ^8.1.4
  cached_network_image: ^3.2.3
  carousel_slider: ^4.2.1
  collection: ^1.18.0
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  device_info_plus: ^10.1.0
  dio: ^5.0.1
  easy_localization: ^3.0.1
  equatable: ^2.0.5
  file_picker: ^8.0.3
  firebase_core: ^2.7.0
  firebase_messaging: ^14.2.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.2
  flutter_local_notifications: ^17.1.0
  flutter_screenutil: ^5.6.1
  flutter_slidable: ^3.1.0
  flutter_svg: ^2.0.10+1
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  get_it: ^7.2.0
  get_storage: ^2.0.3
  google_maps_flutter: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  image_picker: ^1.1.0
  internet_connection_checker: ^1.0.0+1
  loading_indicator: ^3.1.0
  open_filex: ^4.3.2
  otp_text_field: ^1.1.3
  path: ^1.9.0
  path_provider: ^2.0.13
  pdf: ^3.10.1
  pdf_render: ^1.4.6
  permission_handler: ^11.3.1
  photo_view: ^0.15.0
  share_plus: ^9.0.0
  shared_preferences: ^2.0.20
  toast: ^0.3.0
  url_launcher: ^6.1.10
  uuid: ^4.4.0
  webview_flutter: ^4.0.6

dev_dependencies:
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.2
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/splashLogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arial-Bold.ttf
          weight: 700
